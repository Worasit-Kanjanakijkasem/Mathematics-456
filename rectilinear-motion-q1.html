<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>โจทย์ Rectilinear Motion - ข้อ 1</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  /* KaTeX font override: Times New Roman for math variables, smaller/better-spaced
     exponents — same fix already verified working in the twin-radical-equation tool */
  .katex .mathnormal, .katex .mathdefault, .katex .mathit { font-family: "Times New Roman", Georgia, "Cambria", serif !important; }
  .katex .katex-sizing.reset-size6.size3.mtight { font-size: 0.78em !important; }
  .katex .msupsub { margin-left: 0.08em; }

  .math-var { font-family: "Times New Roman", Times, serif; font-style: italic; }
  .math-unit { font-family: "Times New Roman", Times, serif; font-style: normal; }
</style>
<style>

  /* =========================================================
     1. BASE / VARIABLES
     ========================================================= */
  :root {
    --navy: #2F3C7E;
    --navy-deep: #232D63;
    --coral: #F96167;
    --coral-deep: #E14A50;
    --gold: #F9E795;
    --ink: #FFFFFF;
    --muted: #B9C0E0;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Noto Sans Thai", sans-serif;
    background: var(--navy);
    color: var(--ink);
    height: 100dvh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    position: relative;
  }

  /* =========================================================
     2. BACKGROUND DECORATION
     ========================================================= */
  .blob { position: absolute; border-radius: 50%; pointer-events: none; }
  .blob-1 { width: 38vmax; height: 38vmax; background: var(--coral); opacity: 0.10; top: -14vmax; right: -12vmax; }
  .blob-2 { width: 26vmax; height: 26vmax; background: var(--gold); opacity: 0.08; bottom: -10vmax; left: -8vmax; }

  /* =========================================================
     3. HEADER
     ========================================================= */
  .eyebrow {
    letter-spacing: 0.10em;
    font-size: clamp(12px, 1.5vw, 16px);
    font-weight: 700;
    color: var(--gold);
    text-align: center;
    margin-bottom: 2px;
    z-index: 1;
  }
  .subtitle {
    font-size: clamp(11px, 1.3vw, 14px);
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
    z-index: 1;
  }

  /* =========================================================
     4. STAGE (scrollable problem / solution area)
     ========================================================= */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    flex: 1;
    width: 100%;
    max-width: 720px;
    padding: 0 20px;
    z-index: 1;
    overflow-y: auto;
  }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .card.swap { opacity: 0; transform: scale(0.97); }

  .eqn {
    font-family: "Cambria", "Georgia", serif;
    font-size: clamp(16px, 2.6vw, 20px);
    line-height: 1.5;
  }

  .qlist { margin: 12px 0 0; padding-left: 20px; }
  .qlist li { margin-bottom: 8px; font-size: clamp(13.5px, 2vw, 15.5px); line-height: 1.5; }

  .sol-title {
    font-weight: 700;
    color: var(--gold);
    font-size: clamp(13px, 1.9vw, 15px);
    margin: 14px 0 6px;
  }
  .sol-title:first-child { margin-top: 0; }

  .sol-line {
    font-family: "Cambria", "Georgia", serif;
    font-size: clamp(14.5px, 2.2vw, 17px);
    line-height: 1.6;
    margin-bottom: 4px;
  }

  .answer-final {
    color: var(--gold);
    font-weight: 700;
  }

  .conclusion {
    margin-top: 6px;
    font-size: clamp(13.5px, 2vw, 15.5px);
    color: var(--ink);
    background: rgba(249,231,149,0.08);
    border-left: 3px solid var(--gold);
    padding: 8px 12px;
    border-radius: 6px;
  }

  /* fraction display */
  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    margin: 0 0.08em;
    line-height: 1.05;
    font-size: 0.85em;
  }
  .frac .num, .frac .den { display: block; padding: 0 0.15em; }
  .frac .num { border-bottom: 0.06em solid currentColor; padding-bottom: 0.03em; }
  .frac .den { padding-top: 0.03em; }

  .prompt {
    margin-top: 4px;
    margin-bottom: 8px;
    font-size: clamp(12.5px, 1.8vw, 15px);
    color: var(--muted);
    text-align: center;
    flex-shrink: 0;
  }

  /* =========================================================
     5. MAIN CONTROLS
     ========================================================= */
  .controls {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 720px;
    padding: 8px 20px clamp(12px, 3vh, 26px);
    z-index: 1;
    flex-shrink: 0;
  }

  button {
    border: none;
    border-radius: 18px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    -webkit-appearance: none;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.96); }

  .btn-next {
    flex: 2;
    background: var(--coral);
    color: var(--ink);
    font-size: clamp(13px, 2vw, 17px);
    padding: clamp(12px, 2.2vh, 18px) 10px;
    white-space: nowrap;
  }

  .btn-toggle {
    flex: 2;
    background: var(--navy-deep);
    color: var(--gold);
    border: 2px solid var(--gold);
    font-size: clamp(13px, 1.9vw, 16px);
    padding: clamp(12px, 2.2vh, 18px) 14px;
  }

  .btn-end {
    flex: 1;
    background: transparent;
    color: var(--muted);
    border: 2px solid var(--navy-deep);
    font-size: clamp(11.5px, 1.5vw, 14px);
    padding: clamp(12px, 2.2vh, 18px) 10px;
  }
  .btn-end:active { background: var(--navy-deep); }

  /* =========================================================
     6. END SCREEN
     ========================================================= */
  .end-screen {
    position: fixed;
    inset: 0;
    background: var(--navy-deep);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    z-index: 10;
  }
  .end-screen.show { display: flex; }
  .end-screen .headline { font-size: clamp(28px, 5.5vw, 48px); font-weight: 800; margin-bottom: 12px; }
  .end-screen .sub { color: var(--muted); font-size: clamp(15px, 2.2vw, 20px); margin-bottom: 32px; }

  .btn-restart {
    background: var(--gold);
    color: var(--navy-deep);
    font-size: clamp(16px, 2.2vw, 20px);
    padding: 16px 36px;
    border-radius: 18px;
  }

</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="eyebrow">กลศาสตร์วิศวกรรม</div>
  <div class="subtitle">Rectilinear Motion · โจทย์ที่ 1 — <span class="math-var">s(t)</span> เป็นพหุนามกำลังสาม</div>

  <div class="stage" id="stage">
    <div class="card" id="problemCard"></div>
    <div class="card" id="solutionCard" style="display:none;"></div>
  </div>

  <div class="prompt" id="promptEl">คำนวณหาคำตอบทั้ง 4 ข้อ แล้วกดดูเฉลย</div>

  <div class="controls">
    <button class="btn-next" id="nextBtn">ข้อต่อไป</button>
    <button class="btn-toggle" id="toggleBtn">ดูเฉลย</button>
    <button class="btn-end" id="endBtn">จบ</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="headline">จบแบบฝึกหัด</div>
    <div class="sub">ฝึกฝนได้ดีมาก!</div>
    <button class="btn-restart" id="restartBtn">เริ่มใหม่</button>
  </div>

<script>

  /* =========================================================
     0. DOM REFS
     ========================================================= */
  const problemCard = document.getElementById("problemCard");
  const solutionCard = document.getElementById("solutionCard");
  const promptEl = document.getElementById("promptEl");
  const nextBtn = document.getElementById("nextBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const endBtn = document.getElementById("endBtn");
  const endScreen = document.getElementById("endScreen");
  const restartBtn = document.getElementById("restartBtn");

  let current = null;
  let showingAnswer = false;

  /* =========================================================
     1. HELPERS
     ========================================================= */
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function choice(arr) { return arr[randInt(0, arr.length - 1)]; }

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) [a, b] = [b, a % b];
    return a || 1;
  }
  function simplifyFrac(n, d) {
    const g = gcd(n, d) || 1;
    let nn = n / g, dd = d / g;
    if (dd < 0) { nn = -nn; dd = -dd; }
    return { n: nn, d: dd };
  }
  function fracDecimal(f) { return f.n / f.d; }

  // format a number to 2 decimals, trimming -0
  function fmt2(x) {
    let r = Math.round(x * 100) / 100;
    if (Object.is(r, -0)) r = 0;
    return r.toFixed(2);
  }
  // wrap in parentheses when negative, for use as the SECOND operand of a visible
  // subtraction (e.g. "375.56 - (-19.94)") so it never reads as a confusing double
  // minus sign "375.56 - -19.94"
  function fmt2Paren(x) {
    const s = fmt2(x);
    return x < 0 ? `(${s})` : s;
  }
  // format a "clean" time value (quarters/halves) without forcing trailing zeros
  function fmtT(x) {
    let r = Math.round(x * 100) / 100;
    return r.toString();
  }

  /* =========================================================
     2. POLYNOMIAL DISPLAY — builds a LaTeX string then renders
     via KaTeX (replaces the old HTML+<sup> approach entirely,
     same upgrade already verified in the twin-radical-equation
     tool: proper math typesetting instead of hand-built HTML)
     term = { n, d, label }  (label = "t^3", "t^2", "t", "")
     ========================================================= */
  function KT(latex) {
    try { return katex.renderToString(latex, { throwOnError: false }); }
    catch (e) { return latex; }
  }
  function polyLatex(terms) {
    let s = "";
    let first = true;
    terms.forEach(term => {
      if (term.n === 0) return;
      const f = simplifyFrac(term.n, term.d);
      const neg = f.n < 0;
      const absN = Math.abs(f.n);
      const isUnit = (absN === f.d) && term.label !== "";
      let magLatex;
      if (f.d === 1) {
        magLatex = isUnit ? "" : String(absN);
      } else {
        magLatex = `\\frac{${absN}}{${f.d}}`;
      }
      if (first) {
        s += (neg ? "-" : "") + magLatex + term.label;
        first = false;
      } else {
        s += ` ${neg ? "-" : "+"} ${magLatex}${term.label}`;
      }
    });
    return s === "" ? "0" : s;
  }
  function polyKT(terms) { return KT(polyLatex(terms)); }

  /* =========================================================
     2b. TRIPLE GRAPH (s-t, v-t, a-t) — shared time axis, with
     dashed vertical reference lines at v=0 and a=0 (drawn at the
     SAME x-position in each stacked panel using the same scale,
     so they visually line up across all three graphs)
     ========================================================= */
  const GOLD = "#F9E795", MUTED = "#B9C0E0", GRID = "#5A6296";
  function buildTripleGraph(p) {
    const W = 600, H = 128, padL = 42, padR = 14, padT = 16, padB = 22;
    const tMin = 0, tMax = p.t5;

    const vZeros = p.rootsInRange; // already filtered to [0, t5] by generateProblem()
    const accADecimal = fracDecimal(simplifyFrac(p.accTerms[0].n, p.accTerms[0].d));
    let aZero = null;
    if (Math.abs(accADecimal) > 1e-12) {
      const t0 = -(p.accTerms[1].n / p.accTerms[1].d) / accADecimal;
      if (t0 >= -1e-9 && t0 <= tMax + 1e-9) aZero = Math.max(0, t0);
    }
    const vMarkers = vZeros;
    const aMarkers = aZero !== null ? [aZero] : [];

    function toX(t) { return padL + (t - tMin) / (tMax - tMin) * (W - padL - padR); }

    function buildPanel(fn, variableLabel, unitText) {
      const N = 60;
      const pts = [];
      for (let i = 0; i <= N; i++) {
        const t = tMin + (tMax - tMin) * i / N;
        pts.push([t, fn(t)]);
      }
      let yMin = Math.min(...pts.map(pt => pt[1]), 0);
      let yMax = Math.max(...pts.map(pt => pt[1]), 0);
      if (yMin === yMax) { yMin -= 1; yMax += 1; }
      const yPad = (yMax - yMin) * 0.15 || 1;
      yMin -= yPad; yMax += yPad;

      function toY(v) { return H - padB - (v - yMin) / (yMax - yMin) * (H - padT - padB); }

      let d = "";
      pts.forEach(([t, v], i) => { d += (i === 0 ? "M" : "L") + toX(t).toFixed(1) + "," + toY(v).toFixed(1) + " "; });

      let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%; display:block;">`;
      svg += `<line x1="${padL}" y1="${toY(0).toFixed(1)}" x2="${W - padR}" y2="${toY(0).toFixed(1)}" stroke="${GRID}" stroke-width="1"/>`;
      svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="${GRID}" stroke-width="1"/>`;
      vMarkers.forEach(t => {
        const x = toX(t).toFixed(1);
        svg += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H - padB}" stroke="${GOLD}" stroke-width="1.3" stroke-dasharray="4 3"/>`;
      });
      aMarkers.forEach(t => {
        const x = toX(t).toFixed(1);
        svg += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${H - padB}" stroke="${p.coral || '#F96167'}" stroke-width="1.3" stroke-dasharray="2 3"/>`;
      });
      svg += `<path d="${d}" fill="none" stroke="white" stroke-width="2"/>`;
      svg += `<text x="${padL}" y="12" font-size="11" fill="${GOLD}" font-weight="700" font-family="Times New Roman, Times, serif">`;
      const fnName = variableLabel.charAt(0);
      svg += `<tspan font-style="italic">${fnName}</tspan>`;
      svg += `<tspan font-style="normal">(</tspan>`;
      svg += `<tspan font-style="italic">t</tspan>`;
      svg += `<tspan font-style="normal">)  [${unitText}]</tspan>`;
      svg += `</text>`;
      svg += `<text x="${padL}" y="${H - 5}" font-size="9" fill="${MUTED}">0</text>`;
      svg += `<text x="${W - padR}" y="${H - 5}" font-size="9" fill="${MUTED}" text-anchor="end">${fmtT(tMax)}</text>`;
      svg += `</svg>`;
      return svg;
    }

    let html = `<div style="background:rgba(255,255,255,0.04); border-radius:10px; padding:10px 10px 4px; margin-bottom:14px;">`;
    html += buildPanel(p.evalS, "s(t)", "m");
    html += buildPanel(p.evalV, "v(t)", "m/s");
    html += buildPanel(p.evalAcc, "a(t)", "m/s²");
    if (vMarkers.length || aMarkers.length) {
      html += `<div style="font-size:11px; color:${MUTED}; text-align:center; margin-top:2px; font-family:'Times New Roman', Times, serif; font-style:normal;">`;
      if (vMarkers.length) {
        html += `<span style="color:${GOLD};">- - -</span> <span class="math-var">v</span>(<span class="math-var">t</span>)=0`;
      }
      if (aMarkers.length) {
        if (vMarkers.length) html += `&nbsp;&nbsp;`;
        html += `<span style="color:#F96167;">- - -</span> <span class="math-var">a</span>(<span class="math-var">t</span>)=0`;
      }
      html += `</div>`;
    }
    html += `</div>`;
    return html;
  }

  /* =========================================================
     3. PROBLEM GENERATOR
     ========================================================= */
  function genA() {
    const denom = choice([2, 4]);
    const maxK = 4 * denom; // a <= 4
    const k = randInt(1, maxK);
    return simplifyFrac(k, denom); // {n,d}
  }

  function genBCD() {
    let b, c, d, zeroCount;
    do {
      b = randInt(-10, 10);
      c = randInt(-10, 10);
      d = randInt(-10, 10);
      zeroCount = [b, c, d].filter(v => v === 0).length;
    } while (zeroCount > 1);
    return { b, c, d };
  }

  function genTimes() {
    const t1 = randInt(8, 24) / 4;   // 2.00 - 6.00, step .25
    const t2 = randInt(8, 24) / 4;

    // t3, t4 in (2, 8], step .25, t3 < t4
    let idx1 = randInt(9, 32), idx2;
    do { idx2 = randInt(9, 32); } while (idx2 === idx1);
    const lo = Math.min(idx1, idx2) / 4;
    const hi = Math.max(idx1, idx2) / 4;

    const t5 = randInt(12, 24) / 2; // 6.0 - 12.0, step .5

    return { t1, t2, t3: lo, t4: hi, t5 };
  }

  function generateProblem() {
    const a = genA();               // fraction {n,d}
    const { b, c, d } = genBCD();
    const { t1, t2, t3, t4, t5 } = genTimes();

    const aVal = fracDecimal(a);

    // s(t) terms
    const sTerms = [
      { n: a.n, d: a.d, label: "t^3" },
      { n: b, d: 1, label: "t^2" },
      { n: c, d: 1, label: "t" },
      { n: d, d: 1, label: "" }
    ];

    // v(t) = 3a t^2 + 2b t + c
    const vA = simplifyFrac(3 * a.n, a.d);
    const vTerms = [
      { n: vA.n, d: vA.d, label: "t^2" },
      { n: 2 * b, d: 1, label: "t" },
      { n: c, d: 1, label: "" }
    ];

    // acc(t) = 6a t + 2b
    const accA = simplifyFrac(6 * a.n, a.d);
    const accTerms = [
      { n: accA.n, d: accA.d, label: "t" },
      { n: 2 * b, d: 1, label: "" }
    ];

    function evalS(t) { return aVal * t ** 3 + b * t ** 2 + c * t + d; }
    function evalV(t) { return fracDecimal(vA) * t ** 2 + 2 * b * t + c; }
    function evalAcc(t) { return fracDecimal(accA) * t + 2 * b; }

    // quadratic v(t) = 0 -> A t^2 + B t + C = 0
    const A = fracDecimal(vA);
    const B = 2 * b;
    const C = c;
    const D = B * B - 4 * A * C;

    let roots = [];
    const EPS = 1e-9;
    if (D > EPS) {
      const sqrtD = Math.sqrt(D);
      roots = [(-B - sqrtD) / (2 * A), (-B + sqrtD) / (2 * A)].sort((x, y) => x - y);
    } else if (Math.abs(D) <= EPS) {
      roots = [-B / (2 * A)];
    }
    const rootsInRange = Math.abs(D) <= EPS
      ? []
      : roots.filter(r => r >= -EPS && r <= t5 + EPS).map(r => Math.max(0, r));

    return {
      a, b, c, d, t1, t2, t3, t4, t5,
      sTerms, vTerms, accTerms,
      evalS, evalV, evalAcc,
      A, B, C, D, roots, rootsInRange
    };
  }

  /* =========================================================
     4. RENDER
     ========================================================= */
  function renderProblem(p) {
    problemCard.innerHTML = `
      <div class="eqn">${KT(`s(t) = ${polyLatex(p.sTerms)}`)} &nbsp; (${KT(`\\mathrm{m}`)}), &nbsp; ${KT("t")} (${KT(`\\mathrm{s}`)})</div>
      <ol class="qlist">
        <li>ที่เวลา <span class="math-var">t</span> = ${fmtT(p.t1)} <span class="math-unit">s</span> อนุภาคมีความเร็วเท่าใด</li>
        <li>ที่เวลา <span class="math-var">t</span> = ${fmtT(p.t2)} <span class="math-unit">s</span> อนุภาคมีความเร่งเท่าใด</li>
        <li>การกระจัด (displacement) จากเวลา <span class="math-var">t</span> = ${fmtT(p.t3)} <span class="math-unit">s</span> ถึง <span class="math-var">t</span> = ${fmtT(p.t4)} <span class="math-unit">s</span> มีค่าเท่าใด</li>
        <li>การเคลื่อนที่ในช่วง 0 ถึง ${fmtT(p.t5)} <span class="math-unit">s</span> มีการกลับทิศหรือไม่ ถ้ามี มีกี่ครั้งและที่เวลาใดบ้าง</li>
      </ol>
    `;
  }

  function renderSolution(p) {
    const v1 = p.evalV(p.t1);
    const a2 = p.evalAcc(p.t2);
    const s3 = p.evalS(p.t3);
    const s4 = p.evalS(p.t4);
    const disp = s4 - s3;

    let q4Lines = "";
    q4Lines += `<div class="sol-line">${KT(`v(t) = 0 \\;\\Rightarrow\\; ${polyLatex(p.vTerms)} = 0`)}</div>`;
    q4Lines += `<div class="sol-line">${KT(`A = ${fmt2(p.A)},\\quad B = ${fmt2(p.B)},\\quad C = ${fmt2(p.C)}`)}</div>`;
    q4Lines += `<div class="sol-line">${KT(`D = B^2 - 4AC = ${fmt2(p.D)}`)}</div>`;

    if (p.D < -1e-9) {
      q4Lines += `<div class="conclusion"><span class="math-var">D</span> &lt; 0 \u21d2 สมการไม่มีคำตอบจริง \u21d2 <span class="answer-final">ความเร็วไม่เปลี่ยนเครื่องหมายในช่วงนี้ ⇒ ไม่มีการกลับทิศ</span></div>`;
    } else {
      const rootsStr = p.roots.map(r => `${fmt2(r)}\\,\\mathrm{s}`).join(",\\; ");
      q4Lines += `<div class="sol-line">${KT(`t = ${rootsStr}`)}</div>`;
      if (Math.abs(p.D) <= 1e-9) {
        q4Lines += `<div class="conclusion">${KT(`D = 0`)} ⇒ เป็นรากซ้ำ ⇒ ความเร็วเป็นศูนย์ชั่วขณะ แต่ไม่เปลี่ยนเครื่องหมาย ⇒ <span class="answer-final">ไม่มีการกลับทิศ</span></div>`;
      } else if (p.rootsInRange.length === 0) {
        q4Lines += `<div class="conclusion">ไม่มีรากใดอยู่ในช่วง [0, ${fmtT(p.t5)}] \u21d2 <span class="answer-final">ไม่มีการกลับทิศในช่วงที่กำหนด</span></div>`;
      } else {
        const inRangeStr = p.rootsInRange.map(r => `${fmt2(r)}\\,\\mathrm{s}`).join(",\\; ");
        q4Lines += `<div class="conclusion"><span class="answer-final">มีการกลับทิศ ${p.rootsInRange.length} ครั้ง</span> ที่เวลา ${KT(`t = ${inRangeStr}`)}</div>`;
      }
    }

    solutionCard.innerHTML = `
      <div class="sol-title">อนุพันธ์อันดับ 1 (ความเร็ว)</div>
      <div class="sol-line">${KT(`v(t) = \\dfrac{ds}{dt} = 3at^2+2bt+c = ${polyLatex(p.vTerms)}`)} &nbsp; (${KT(`\\frac{\\mathrm{m}}{\\mathrm{s}}`)})</div>

      <div class="sol-title">อนุพันธ์อันดับ 2 (ความเร่ง)</div>
      <div class="sol-line">${KT(`a(t) = \\dfrac{dv}{dt} = 6at+2b = ${polyLatex(p.accTerms)}`)} &nbsp; (${KT(`\\frac{\\mathrm{m}}{\\mathrm{s}^2}`)})</div>

      <div class="sol-title">กราฟ <span class="math-var">s</span>(<span class="math-var">t</span>), <span class="math-var">v</span>(<span class="math-var">t</span>), <span class="math-var">a</span>(<span class="math-var">t</span>) (แกนเวลาเดียวกัน)</div>
      ${buildTripleGraph(p)}

      <div class="sol-title">ข้อ 1: ความเร็วที่ ${KT(`t = ${fmtT(p.t1)}\\,\\mathrm{s}`)}</div>
      <div class="sol-line">${KT(`v(${fmtT(p.t1)}) = ${polyLatex(p.vTerms)}`)} &nbsp;\u2192&nbsp; แทนค่า ${KT(`t = ${fmtT(p.t1)}`)}</div>
      <div class="sol-line"><span class="answer-final">${KT(`v(${fmtT(p.t1)}) = ${fmt2(v1)}\\,\\frac{\\mathrm{m}}{\\mathrm{s}}`)}</span></div>

      <div class="sol-title">ข้อ 2: ความเร่งที่ ${KT(`t = ${fmtT(p.t2)}\\,\\mathrm{s}`)}</div>
      <div class="sol-line">${KT(`a(${fmtT(p.t2)}) = ${polyLatex(p.accTerms)}`)} &nbsp;\u2192&nbsp; แทนค่า ${KT(`t = ${fmtT(p.t2)}`)}</div>
      <div class="sol-line"><span class="answer-final">${KT(`a(${fmtT(p.t2)}) = ${fmt2(a2)}\\,\\frac{\\mathrm{m}}{\\mathrm{s}^2}`)}</span></div>

      <div class="sol-title">ข้อ 3: การกระจัดจาก ${KT(`t = ${fmtT(p.t3)}\\,\\mathrm{s}`)} ถึง ${KT(`t = ${fmtT(p.t4)}\\,\\mathrm{s}`)}</div>
      <div class="sol-line">${KT(`s(${fmtT(p.t4)}) = ${fmt2(s4)}\\,\\mathrm{m}`)}</div>
      <div class="sol-line">${KT(`s(${fmtT(p.t3)}) = ${fmt2(s3)}\\,\\mathrm{m}`)}</div>
      <div class="sol-line">${KT(`\\Delta s = s(${fmtT(p.t4)}) - s(${fmtT(p.t3)}) = ${fmt2(s4)} - ${fmt2Paren(s3)} =`)} <span class="answer-final">${KT(`${fmt2(disp)}\\,\\mathrm{m}`)}</span></div>

      <div class="sol-title">ข้อ 4: การกลับทิศในช่วง 0 ถึง ${fmtT(p.t5)} <span class="math-unit">s</span></div>
      ${q4Lines}
    `;
  }

  /* =========================================================
     5. DISPLAY STATE
     ========================================================= */
  function showProblem() {
    problemCard.style.display = "";
    solutionCard.style.display = "none";
    promptEl.textContent = "คำนวณหาคำตอบทั้ง 4 ข้อ แล้วกดดูเฉลย";
    toggleBtn.textContent = "ดูเฉลย";
  }
  function showSolution() {
    problemCard.style.display = "none";
    solutionCard.style.display = "";
    promptEl.textContent = "นี่คือเฉลย";
    toggleBtn.textContent = "ดูโจทย์";
  }

  function newProblem() {
    current = generateProblem();
    renderProblem(current);
    renderSolution(current);
    showingAnswer = false;
    showProblem();
  }

  function showNext() {
    problemCard.classList.add("swap");
    solutionCard.classList.add("swap");
    setTimeout(() => {
      newProblem();
      problemCard.classList.remove("swap");
      solutionCard.classList.remove("swap");
    }, 150);
  }

  function toggleAnswer() {
    const el = showingAnswer ? solutionCard : problemCard;
    el.classList.add("swap");
    setTimeout(() => {
      showingAnswer = !showingAnswer;
      if (showingAnswer) showSolution(); else showProblem();
      (showingAnswer ? solutionCard : problemCard).classList.remove("swap");
    }, 150);
  }

  /* =========================================================
     6. EVENTS
     ========================================================= */
  nextBtn.addEventListener("click", showNext);
  toggleBtn.addEventListener("click", toggleAnswer);
  endBtn.addEventListener("click", () => endScreen.classList.add("show"));
  restartBtn.addEventListener("click", () => {
    endScreen.classList.remove("show");
    showNext();
  });

  /* =========================================================
     7. INITIAL LOAD
     ========================================================= */
  newProblem();

</script>

</body>
</html>
